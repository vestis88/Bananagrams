<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const CSS = `
:root{
  --filt:#0f3b34; --filt2:#0b2e29; --kram:#f6efe0; --kram-skug:#d8cdb4;
  --bly:#1d2b2a; --banan:#f4c430; --banan-m:#e2a800; --skala:#7bbf6a;
  --banan-mogen:#f0a93a; --dump:#6d5b46; --fara:#d8603e; --dim:#8aa39c;
  --rad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
.bf-root{
  position:fixed;inset:0;overflow:hidden;
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;
  color:var(--kram);background:radial-gradient(120% 120% at 50% -10%,#155049 0%,var(--filt) 45%,var(--filt2) 100%);
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;touch-action:none;
}
.bf-wrap{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
.bf-h1{font-weight:800;letter-spacing:.5px;}
.bf-banana-logo{font-size:13px;font-weight:800;letter-spacing:3px;color:var(--banan);text-transform:uppercase;}
button{font-family:inherit;cursor:pointer;border:none;}
.bf-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:var(--rad);}
.bf-btn{border-radius:12px;font-weight:800;font-size:16px;padding:14px 16px;color:var(--bly);background:var(--banan);
  box-shadow:0 3px 0 var(--banan-m);transition:transform .05s,box-shadow .05s;}
.bf-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--banan-m);}
.bf-btn.ghost{background:transparent;color:var(--kram);border:1.5px solid rgba(255,255,255,.25);box-shadow:none;}
.bf-btn.ghost:active{transform:translateY(1px);background:rgba(255,255,255,.06);}
.bf-btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;transform:none;}
.bf-input{width:100%;background:rgba(0,0,0,.22);border:1.5px solid rgba(255,255,255,.14);border-radius:12px;
  color:var(--kram);font-size:17px;padding:14px 16px;font-family:inherit;text-align:center;font-weight:700;letter-spacing:1px;}
.bf-input:focus{outline:none;border-color:var(--banan);}
.bf-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;}

/* Brickor */
.tile{
  background:linear-gradient(180deg,#fffdf6,var(--kram));
  color:var(--bly);border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;position:relative;
  box-shadow:0 2px 3px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 0 var(--kram-skug);
}
.tile .sub{position:absolute;right:3px;bottom:1px;font-size:8px;font-weight:800;opacity:.4;}
.tile.sel{outline:3px solid var(--banan);outline-offset:1px;}
.tile.bad{box-shadow:0 0 0 2px var(--fara),0 2px 3px rgba(0,0,0,.3);}
.tile.ghost{position:fixed;z-index:90;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) scale(1.06);}

/* Topprad */
.bf-top{display:flex;align-items:center;gap:8px;padding:8px 12px;}
.bf-pill{background:rgba(0,0,0,.25);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px;}
.bf-players{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 8px;touch-action:pan-x;}
.bf-pcard{flex:0 0 auto;background:rgba(0,0,0,.22);border-radius:10px;padding:6px 9px;min-width:64px;text-align:center;border:1.5px solid transparent;}
.bf-pcard.done{border-color:var(--skala);}
.bf-pcard.you{border-color:var(--banan);}
.bf-pcard.rutten{opacity:.45;}
.bf-pname{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px;}
.bf-pcount{font-size:17px;font-weight:800;}
.bf-pcount.dim{color:var(--dim);font-size:12px;}

/* Br\xE4de */
.bf-boardwrap{flex:1;min-height:0;position:relative;overflow:hidden;background:
  radial-gradient(100% 60% at 50% 100%,rgba(0,0,0,.25),transparent);}
.bf-board{position:absolute;top:0;left:0;transform-origin:0 0;}
.bf-cellgrid{position:absolute;inset:0;background-size:var(--cell) var(--cell);
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);}
.bf-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:8;}
.bf-zoom button{width:42px;height:42px;border-radius:11px;background:rgba(0,0,0,.4);color:#fff;font-size:22px;font-weight:800;
  border:1px solid rgba(255,255,255,.12);}
.bf-hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);pointer-events:none;}

/* Hylla + knappar */
.bf-dock{padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(0,0,0,.32));}
.bf-rack{display:flex;flex-direction:column;gap:6px;padding:6px 2px;min-height:54px;justify-content:center;}
.bf-rack.empty{justify-content:center;color:var(--dim);font-weight:700;font-size:13px;text-align:center;}
.bf-rack-row{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:nowrap;overflow-x:auto;touch-action:pan-x;}
.bf-toolrow{display:flex;gap:6px;margin-top:6px;}
.bf-tool{flex:1;border-radius:11px;background:rgba(255,255,255,.08);color:var(--kram);font-weight:800;font-size:12px;padding:9px 4px;border:1px solid rgba(255,255,255,.1);}
.bf-tool:active{background:rgba(255,255,255,.16);}
.bf-actions{display:flex;gap:8px;margin-top:8px;}
.bf-skala{flex:2;border-radius:13px;font-weight:900;font-size:18px;padding:15px;color:#10301a;background:var(--skala);box-shadow:0 3px 0 #4f9a40;letter-spacing:1px;}
.bf-skala:active{transform:translateY(2px);box-shadow:0 1px 0 #4f9a40;}
.bf-banan{flex:2;border-radius:13px;font-weight:900;font-size:18px;padding:15px;color:#3a2400;background:var(--banan-mogen);box-shadow:0 3px 0 #c47e1f;letter-spacing:1px;}
.bf-banan:active{transform:translateY(2px);box-shadow:0 1px 0 #c47e1f;}
.bf-dumpbtn{flex:1;border-radius:13px;font-weight:800;font-size:14px;padding:15px 6px;color:var(--kram);background:var(--dump);box-shadow:0 3px 0 #4c4031;}
.bf-dumpbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #4c4031;}
.bf-actions button:disabled{opacity:.35;box-shadow:none;transform:none;}

/* Overlay */
.bf-ov{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(7,24,21,.82);backdrop-filter:blur(3px);padding:18px;}
.bf-ovcard{background:var(--filt);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:20px;width:100%;max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:90%;display:flex;flex-direction:column;}
.bf-count{font-size:96px;font-weight:900;color:var(--banan);text-align:center;line-height:1;}
.bf-flash{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center;z-index:30;pointer-events:none;}
.bf-flash .msg{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;
